# Static analysis, on the repository that is also a job application.
#
# The practical value is small on a codebase this size and the signalling value
# is not: a reviewer who opens the Security tab and finds it configured and
# clean learns something about how the project is run.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Includes the query packs beyond the default set. Slower; this is not
          # a repository where twenty minutes a week matters.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
