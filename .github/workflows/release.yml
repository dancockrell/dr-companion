# Push a tag, get an installer.
#
# The audience for this project includes people who have never installed Lich
# and are not going to build from source to try a GUI. "Download the .exe from
# the releases page" is the whole distribution story, and it should not depend
# on somebody having a working Rust toolchain on the day they feel like cutting
# a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A release that fails on first launch is worse than no release, and this
      # is the check that would have caught the one that did.
      - name: Bundle integrity
        run: npm run test:bundle

      - name: Build
        run: npm run tauri:build

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true          # a human looks at it before it is public
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
