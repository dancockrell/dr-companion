# Tag v* -> builds the Windows installer and opens a draft release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

env:
  # The version godot/project.godot declares (config/features "4.3"). Bumping
  # the project without bumping this exports with the wrong templates.
  GODOT_VERSION: '4.3'

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The viewer's admitted runtime assets live in the shared-assets
          # submodule, and the Godot export refuses to run without them. The
          # ordinary CI job does not need them and does not pay for them.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Bundle integrity
        run: npm run test:bundle

      # Godot is only needed to build the viewer, so it is installed here
      # rather than in the ordinary CI job, which never exports one.
      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot/releases/download/$v-stable"
          Invoke-WebRequest "$base/Godot_v$v-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin
          Invoke-WebRequest "$base/Godot_v$v-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive -LiteralPath templates.tpz -DestinationPath templates -Force
          $dest = "$env:APPDATA\Godot\export_templates\$v.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item templates\templates\* $dest -Recurse -Force
          $exe = (Get-ChildItem godot-bin -Filter 'Godot_v*.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Godot executable not found after extracting the release zip' }
          "GODOT4=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export the world viewer
        run: npm run godot:export

      # The export can exit cleanly having produced nothing if a preset or a
      # template is wrong, and an installer missing the viewer looks identical
      # to one that never tried. Fail here, where the reason is still on screen.
      - name: Confirm the viewer was actually built
        shell: pwsh
        run: |
          $exe = 'godot/build/DRCompanionWorldViewer.exe'
          if (-not (Test-Path $exe)) { throw "Godot export produced no $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "Exported viewer is only $size bytes, which is not a real build" }
          Write-Host "Viewer built: $size bytes"

      - name: Derive the release config
        run: npm run release:config

      - name: Build
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Confirm the installer carries the viewer and everything it already shipped
        run: npm run release:verify

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
