# Tag v* -> runs the whole of ci.yml on that commit, then builds the Windows
# installer and opens a draft release. Nothing is built until the gate passes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

env:
  # The version godot/project.godot declares (config/features "4.3"). Bumping
  # the project without bumping this exports with the wrong templates. The
  # `godot` job in ci.yml pins the same version and refuses to run when
  # project.godot disagrees with it, so a bump that leaves this behind is
  # caught by the gate above before this file ever installs anything.
  GODOT_VERSION: '4.3'

jobs:
  # Everything ci.yml runs, on this exact commit, before anything is built or
  # published.
  #
  # Until 5 Sep 2026 there was no `needs:` in this file and ci.yml's `push`
  # trigger filtered on `branches:`, which cannot match `refs/tags/v*`. A tag
  # pushed at any commit therefore built an installer and opened a draft
  # release having run `test:bundle` and nothing else - 1 of 142 suites, no
  # tsc, no lint, no clippy, no Rust tests, on a commit nobody had verified.
  # Trap 21 in docs/PLAN_TO_1_0.md records that `main` has no branch protection
  # and no rulesets either, so nothing outside these two files closed it.
  #
  # Of the two available fixes this is the one that is enforced rather than
  # merely correlated. Adding `tags: ['v*']` to ci.yml and having this workflow
  # look for the result would need `workflow_run` (which fires on completion,
  # not before, and reports from the default branch) or a polling step against
  # the commit-status API - a check somebody has to keep honest. `needs:` on a
  # `workflow_call` is a hard edge in GitHub's own scheduler: the installer job
  # cannot start until every job in ci.yml has succeeded on this commit, and
  # the suites stay defined in exactly one place.
  ci:
    uses: ./.github/workflows/ci.yml

  installer:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # NOT `submodules: recursive`. The viewer's admitted runtime assets
          # live in a submodule pointing at a *private* repository, and a
          # workflow's built-in GITHUB_TOKEN is scoped to this repository
          # alone. Checkout therefore could not clone it, and the job died
          # before anything was built - which is what the first real run of
          # this workflow found. The submodule is fetched conditionally below.
          submodules: false

      # The gate above ran against the commit this workflow was *triggered* at.
      # The checkout just above can be pointed somewhere else by the
      # workflow_dispatch input, and then the suites would have passed on one
      # tree while a different one was packaged and published - which is the
      # same hole the `needs:` closes, reopened one step later and harder to
      # see. Dispatch with the tag selected as the ref; the input then names
      # the same commit and this passes.
      - name: The commit CI passed on is the commit being built
        shell: bash
        run: |
          set -euo pipefail
          built=$(git rev-parse HEAD)
          if [ "$built" != "${{ github.sha }}" ]; then
            echo "::error::Checked out $built, but the ci job that gated this run was for ${{ github.sha }}."
            echo "::error::Re-run this workflow with the tag itself selected as the ref, so the"
            echo "::error::commit that was tested is the commit that gets shipped."
            exit 1
          fi
          echo "Building $built - the commit the ci job passed on."

      # Three states, not two: the assets are present, deliberately absent, or
      # wanted and unreachable. An installer with no world viewer is a
      # supported build - the plan ships beta.1 with the viewer disabled - and
      # what must never happen is a release that looks like it carries a viewer
      # and does not. So the presence of a credential decides, once, here, and
      # every later step reads that decision instead of guessing.
      - name: Fetch the viewer's shared assets, if there is a key for them
        id: assets
        shell: bash
        env:
          TOKEN: ${{ secrets.SHARED_ASSETS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No SHARED_ASSETS_TOKEN secret. Building an installer with no world viewer."
            echo "viewer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
          if git submodule update --init --recursive; then
            echo "Shared assets fetched. This installer will carry a world viewer."
            echo "viewer=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SHARED_ASSETS_TOKEN is set but the submodule could not be fetched."
            echo "::error::Refusing to quietly ship a viewerless installer when a viewer was asked for."
            exit 1
          fi

      # From package.json's `engines.node`, like every other setup-node here,
      # so this file cannot drift again. It sat on 22 while the
      # comment in ci.yml said "Node 24 everywhere, matching what this repo is
      # developed and typed against" - and it is the one workflow that ships
      # the artefact, so `npm run build` and `npm run tauri:build` were the two
      # commands running on a runtime nobody develops on. Not demonstrated to
      # have broken anything; the point is that a difference nobody intended is
      # a difference nobody is testing.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Bundle integrity
        run: npm run test:bundle

      # Godot is only needed to build the viewer, so it is installed here
      # rather than in the ordinary CI job, which never exports one.
      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.assets.outputs.viewer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot/releases/download/$v-stable"
          Invoke-WebRequest "$base/Godot_v$v-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin
          Invoke-WebRequest "$base/Godot_v$v-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive -LiteralPath templates.tpz -DestinationPath templates -Force
          $dest = "$env:APPDATA\Godot\export_templates\$v.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item templates\templates\* $dest -Recurse -Force
          $exe = (Get-ChildItem godot-bin -Filter 'Godot_v*.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Godot executable not found after extracting the release zip' }
          "GODOT4=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export the world viewer
        if: steps.assets.outputs.viewer == 'true'
        run: npm run godot:export

      # The export can exit cleanly having produced nothing if a preset or a
      # template is wrong, and an installer missing the viewer looks identical
      # to one that never tried. Fail here, where the reason is still on screen.
      - name: Confirm the viewer was actually built
        if: steps.assets.outputs.viewer == 'true'
        shell: pwsh
        run: |
          $exe = 'godot/build/DRCompanionWorldViewer.exe'
          if (-not (Test-Path $exe)) { throw "Godot export produced no $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "Exported viewer is only $size bytes, which is not a real build" }
          Write-Host "Viewer built: $size bytes"

      # `--require-viewer` turns a missing viewer into a failure for the build
      # that was supposed to have one. Without the flag the generator writes a
      # config with the base resources only and says so.
      - name: Derive the release config
        run: npm run release:config -- ${{ steps.assets.outputs.viewer == 'true' && '--require-viewer' || '' }}

      - name: Build
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Confirm the installer carries everything it should
        run: npm run release:verify -- ${{ steps.assets.outputs.viewer == 'true' && '--expect-viewer' || '' }}

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          # Says which of the two builds this is, on the release itself, where
          # somebody downloading it will see it.
          body: |
            ${{ steps.assets.outputs.viewer == 'true'
              && 'This build includes the Godot world viewer.'
              || 'This build does **not** include the Godot world viewer. The client runs without it and reports it as not installed. To build one, set the `SHARED_ASSETS_TOKEN` secret to a token that can read the shared-assets repository.' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
