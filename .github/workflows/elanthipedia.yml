# Scrapes Elanthipedia hourly and commits the result to data/elanthipedia/.
# Clients read the committed files; they never hit the wiki themselves.
name: elanthipedia

on:
  schedule:
    # Churn is about one page an hour per the comment above, but the wiki
    # doesn't need catching within the hour it changes -- every 4h still
    # catches same-day edits and cuts run volume (and the notification
    # noise that comes with it) by 75% for no real loss.
    - cron: '17 */4 * * *'
  workflow_dispatch:

# One refresh at a time.
concurrency:
  group: elanthipedia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Refresh from Elanthipedia
        run: |
          if [ -f data/elanthipedia/state.json ]; then
            node tools/elanthipedia.mjs update
          else
            node tools/elanthipedia.mjs index
            node tools/elanthipedia.mjs full
          fi

      - name: Publish if anything changed
        run: |
          # The standard Actions bot identity, not Dan's own noreply address.
          # This used to commit as 173971169+dancockrell@users.noreply.github.com
          # -- the exact address every human commit in this repo also uses --
          # so an automated hourly commit was indistinguishable from Dan
          # pushing to his own repo, both in git history and in whatever
          # notifications that push triggered.
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/elanthipedia

          # state.json is a cursor and moves every run. Commit only when the
          # data changed; leaving the cursor behind means the next run asks
          # from the older timestamp, which costs a request and misses nothing.
          if git diff --staged --quiet -- data/elanthipedia ':!data/elanthipedia/state.json'; then
            echo 'nothing new on the wiki'
            exit 0
          fi

          git commit -m "Elanthipedia refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
