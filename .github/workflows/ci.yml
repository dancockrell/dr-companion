# Types, lint, tests, and a Windows Tauri build on every push and PR.
# test:bundle checks the built output still resolves the Tauri API, which is
# the failure that shipped once and reported itself as "Ready, 0 of 0".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need Rust.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # Listed individually so a failure names itself in the job list.
      - name: Contrast (WCAG AA)
        run: npm run test:contrast
      - name: Log scrubbing
        run: npm run test:scrub
      - name: Frontend
        run: npm run test:frontend
      - name: Bundle integrity
        run: npm run test:bundle

  # The Rust half. Separate so it does not hold up the fast feedback.
  tauri:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npm run tauri:build

  # The bridge runs under whatever Ruby the player has, so test the range.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # ws, for the round-trip test below.
      - run: npm ci

      - name: Commands
        run: ruby lich-scripts/test/cmd_test.rb lich-scripts/companion_bridge.lic
      - name: Runaway guard
        run: ruby lich-scripts/test/runaway_test.rb lich-scripts/companion_bridge.lic
      - name: YAML
        run: ruby lich-scripts/test/yaml_test.rb lich-scripts/companion_bridge.lic
      - name: Server
        run: ruby lich-scripts/test/server_test.rb lich-scripts/companion_bridge.lic
      - name: Map
        run: ruby lich-scripts/test/map_test.rb lich-scripts/companion_bridge.lic
      - name: Live round-trip
        run: npm run test:live
