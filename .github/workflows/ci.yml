# Types, lint, tests, and a Windows Tauri build on every push and PR.
# test:bundle checks the built output still resolves the Tauri API, which is
# the failure that shipped once and reported itself as "Ready, 0 of 0".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request only the tip matters, so superseding a run is right. On
# main it is not: each commit is a distinct state somebody may build on, and
# several sessions push here, so cancelling threw away the verdict for 21 of
# the last 57 pushes. A commit nobody verified is indistinguishable from one
# that passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that does not need Rust.
  checks:
    runs-on: ubuntu-latest
    # 39 suites including a build; the old 15 was sized for ten of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # test:all includes the Ruby bridge suites. Without Ruby they report
      # NOT RUN, which the runner exits non-zero for on purpose - a check that
      # was skipped must never be able to read as one that passed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # Every suite, through the runner that names all failures rather than
      # stopping at the first. Listing them by hand here covered 10 of 39, so
      # 29 suites had no CI at all - test:contrast was red for 24 commits and
      # was one of the ten. The runner reports passed/failed/NOT RUN and exits
      # non-zero for either of the last two, so a suite that could not execute
      # can never be read as one that passed.
      - name: Test suites
        run: npm run test:all

  # The Rust half. Separate so it does not hold up the fast feedback.
  tauri:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json bundles src-tauri/vendor/Ruby4Lich5.exe, and that
      # directory is gitignored (65 MB, rebuilt on Lich's own schedule).
      # build.rs validates resource paths, so with it absent EVERY Rust step
      # fails before compiling anything - clippy and cargo test included, not
      # only the packaging one. Fetch it up front. The script verifies the
      # download against GitHub's published sha256 and no-ops when current.
      - name: Vendor Ruby4Lich5
        run: npm run vendor:fetch

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npm run tauri:build

  # The bridge runs under whatever Ruby the player has, so test the range.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ws, for the round-trip test below.
      - run: npm ci

      - name: Commands
        run: ruby lich-scripts/test/cmd_test.rb lich-scripts/companion_bridge.lic
      - name: Runaway guard
        run: ruby lich-scripts/test/runaway_test.rb lich-scripts/companion_bridge.lic
      - name: YAML
        run: ruby lich-scripts/test/yaml_test.rb lich-scripts/companion_bridge.lic
      - name: Server
        run: ruby lich-scripts/test/server_test.rb lich-scripts/companion_bridge.lic
      - name: Map
        run: ruby lich-scripts/test/map_test.rb lich-scripts/companion_bridge.lic
      - name: Live round-trip
        run: npm run test:live
