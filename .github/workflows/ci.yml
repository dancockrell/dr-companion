# Types, lint, tests, and a Windows Tauri build on every push and PR.
# test:bundle checks the built output still resolves the Tauri API, which is
# the failure that shipped once and reported itself as "Ready, 0 of 0".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request only the tip matters, so superseding a run is right. On
# main it is not: each commit is a distinct state somebody may build on, and
# several sessions push here, so cancelling threw away the verdict for 21 of
# the last 57 pushes. A commit nobody verified is indistinguishable from one
# that passed.
concurrency:
  # Per-commit on main, per-branch everywhere else.
  #
  # Scoping cancel-in-progress to non-main was necessary and not sufficient,
  # which is only visible by measuring: run 33141537207 was cancelled anyway,
  # with zero jobs, while still queued. cancel-in-progress governs the RUNNING
  # member of a group; a newly queued run always supersedes a PENDING one, and
  # that happens whatever the flag says. With several sessions pushing, the
  # middle of any burst is dropped.
  #
  # Giving each main commit its own group is what actually delivers a verdict
  # per commit. Nothing to supersede, nothing to cancel. Pull requests keep
  # sharing a group per branch, where superseding is the right behaviour -
  # only the tip of a PR matters.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Node 24 everywhere, matching what this repo is developed and typed against
# (@types/node ^24). CI sat on 22 and the gap was invisible until a suite used
# an API whose option names changed between them: node:test's mock.module takes
# `namedExports` on 22 and `exports` on 24, so test:backlog linked fine
# locally and failed to instantiate on the runner. Testing on a runtime nobody
# develops on finds problems that are not in the code.

jobs:
  # Everything that does not need Rust.
  checks:
    runs-on: ubuntu-latest
    # 39 suites including a build; the old 15 was sized for ten of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # test:all includes the Ruby bridge suites. Without Ruby they report
      # NOT RUN, which the runner exits non-zero for on purpose - a check that
      # was skipped must never be able to read as one that passed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # Every suite, through the runner that names all failures rather than
      # stopping at the first. Listing them by hand here covered 10 of 39, so
      # 29 suites had no CI at all - test:contrast was red for 24 commits and
      # was one of the ten. The runner reports passed/failed/NOT RUN and exits
      # non-zero for either of the last two, so a suite that could not execute
      # can never be read as one that passed.
      - name: Test suites
        run: npm run test:all

  # The Rust half. Separate so it does not hold up the fast feedback.
  tauri:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json bundles src-tauri/vendor/Ruby4Lich5.exe, and that
      # directory is gitignored (65 MB, rebuilt on Lich's own schedule).
      # build.rs validates resource paths, so with it absent EVERY Rust step
      # fails before compiling anything - clippy and cargo test included, not
      # only the packaging one. Fetch it up front. The script verifies the
      # download against GitHub's published sha256 and no-ops when current.
      - name: Vendor Ruby4Lich5
        run: npm run vendor:fetch

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Flaky in a specific, narrow way: WiX's light.exe, freshly downloaded
      # and extracted a few lines above, occasionally fails to launch at all
      # (`failed to run ...\WixTools314\light.exe`, no stderr, no exit code) -
      # Windows Defender holding a lock on the just-written binary is the
      # usual cause of exactly this shape of failure. Rust and the NSIS
      # installer build fine either way; only the WiX MSI step is affected.
      # rust-cache above means a retry re-runs the flaky external-tool step,
      # not a five-minute Rust recompile.
      - name: Build installer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm run tauri:build

  # The bridge runs under whatever Ruby the player has, so test the range.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ws, for the round-trip test below.
      - run: npm ci

      - name: Commands
        run: ruby lich-scripts/test/cmd_test.rb lich-scripts/companion_bridge.lic
      - name: Runaway guard
        run: ruby lich-scripts/test/runaway_test.rb lich-scripts/companion_bridge.lic
      - name: YAML
        run: ruby lich-scripts/test/yaml_test.rb lich-scripts/companion_bridge.lic
      - name: Server
        run: ruby lich-scripts/test/server_test.rb lich-scripts/companion_bridge.lic
      - name: Map
        run: ruby lich-scripts/test/map_test.rb lich-scripts/companion_bridge.lic
      - name: Live round-trip
        run: npm run test:live
