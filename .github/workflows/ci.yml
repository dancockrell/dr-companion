# Types, lint, tests, and a Windows Tauri build on every push and PR.
# test:bundle checks the built output still resolves the Tauri API, which is
# the failure that shipped once and reported itself as "Ready, 0 of 0".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by .github/workflows/release.yml, which needs it before it builds
  # or publishes anything.
  #
  # `branches:` above cannot match `refs/tags/v*` - branch and tag filters are
  # separate lists - so until 5 Sep 2026 a tag ran release.yml and nothing
  # else, and a draft release could be published from a commit that had run
  # `test:bundle` and no other suite: 1 of 142, no tsc, no lint, no clippy, no
  # Rust tests. Adding `tags:` here would have run this workflow beside the
  # release rather than before it, which is a report and not a gate. A
  # `workflow_call` plus `needs:` is the same suites, defined once, that
  # GitHub will not let the release start without.
  workflow_call:

# On a pull request only the tip matters, so superseding a run is right. On
# main it is not: each commit is a distinct state somebody may build on, and
# several sessions push here, so cancelling threw away the verdict for 21 of
# the last 57 pushes. A commit nobody verified is indistinguishable from one
# that passed.
concurrency:
  # Per-commit on main, per-branch everywhere else.
  #
  # Scoping cancel-in-progress to non-main was necessary and not sufficient,
  # which is only visible by measuring: run 33141537207 was cancelled anyway,
  # with zero jobs, while still queued. cancel-in-progress governs the RUNNING
  # member of a group; a newly queued run always supersedes a PENDING one, and
  # that happens whatever the flag says. With several sessions pushing, the
  # middle of any burst is dropped.
  #
  # Giving each main commit its own group is what actually delivers a verdict
  # per commit. Nothing to supersede, nothing to cancel. Pull requests keep
  # sharing a group per branch, where superseding is the right behaviour -
  # only the tip of a PR matters.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Node 24 everywhere, matching what this repo is developed and typed against
# (@types/node ^24). CI sat on 22 and the gap was invisible until a suite used
# an API whose option names changed between them: node:test's mock.module takes
# `namedExports` on 22 and `exports` on 24, so test:backlog linked fine
# locally and failed to instantiate on the runner. Testing on a runtime nobody
# develops on finds problems that are not in the code.
#
# The version is not written here. Every setup-node in this repository says
# `node-version-file: package.json`, which resolves `engines.node` (">=24"), so
# there is exactly one hand-typed number on the machine and no workflow can
# drift from it the way elanthipedia.yml sat on 22 until 6 Sep 2026. An `env:`
# per workflow would have been the alternative and would have left five numbers
# to keep in step rather than one. `engines` is the better home besides: it is
# the field npm, nvm and every reader already look at, so the pin and the
# README's "Node 24 or newer" claim now have a common authority -
# tools/doc-claims-test.mjs checks all three against each other.

jobs:
  # Everything that does not need Rust.
  checks:
    runs-on: ubuntu-latest
    # 39 suites including a build; the old 15 was sized for ten of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # test:all includes the Ruby bridge suites. Without Ruby they report
      # NOT RUN, which the runner exits non-zero for on purpose - a check that
      # was skipped must never be able to read as one that passed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      # test:video-frame-harvest shells out to ffmpeg for a real end-to-end
      # check (it builds a tiny video and cuts it into frames, not just
      # parses source text). ubuntu-latest does not carry ffmpeg by default -
      # without it the suite correctly reports itself SKIPPED rather than
      # lying about having checked anything, and the runner then (correctly)
      # fails the build for a suite that ran zero checks. Same reasoning as
      # the Ruby step just above, for a different missing binary.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pillow lets the room-scene integrity gate inspect actual decoded
      # pixels. A successful JPEG decode alone previously admitted four files
      # whose lower halves were flat gray or black.
      - run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - run: npm ci

      - name: Types
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      # Every suite, through the runner that names all failures rather than
      # stopping at the first. Listing them by hand here covered 10 of 39, so
      # 29 suites had no CI at all - test:contrast was red for 24 commits and
      # was one of the ten. The runner reports passed/failed/NOT RUN and exits
      # non-zero for either of the last two, so a suite that could not execute
      # can never be read as one that passed.
      - name: Test suites
        run: npm run test:all

  # The eleven .gd scripts in godot/tests - 131 checks that ran in no automated
  # place at all until this job existed.
  #
  # They were written, reviewed, committed, and then only ever run when a human
  # typed `npm run test:godot` on a machine that happened to have a Godot 4.3
  # binary. That is not a theoretical cost: `live_bridge_transport_test.gd` is
  # the only thing in this repository that would have caught #341, and it had
  # never run; before that, the same file called an API that arrived in Godot
  # 4.4 and failed to *parse* for as long as anyone had been shipping it.
  #
  # Separate job rather than a line in tools/test-suites.json, because
  # test:godot needs an engine and would report NOT RUN -> exit 1 for everyone
  # who has not installed one (tools/needs-env.mjs records exactly this).
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The engine this job installs, and the sha512 GitHub publishes for that
      # exact asset in the release's own SHA512-SUMS.txt. Pinned together: a
      # swapped or truncated download fails the checksum rather than running a
      # different engine than the one these tests are about.
      GODOT_VERSION: '4.3'
      GODOT_SHA512: 'fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # godot/project.godot is the authority on which engine this project is.
      # The pin above is a second statement of the same fact, so it is checked
      # rather than trusted: bumping the project without bumping this would
      # otherwise keep testing the new project against the old engine, green
      # the whole way, which is the failure mode the version comment in
      # release.yml warns about and nothing enforced.
      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "PackedStringArray(\"${GODOT_VERSION}\"" godot/project.godot; then
            echo "::error::godot/project.godot does not declare Godot ${GODOT_VERSION}."
            echo "::error::This job pins that version and a sha512 for that exact download."
            echo "::error::Bump GODOT_VERSION and GODOT_SHA512 together (the sum is in the"
            echo "::error::release's SHA512-SUMS.txt) or this would test against the wrong engine."
            grep -n 'config/features' godot/project.godot
            exit 1
          fi
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$base/$zip" -o godot.zip
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$bin"
          "$bin" --version
          # tools/godot-tests.mjs treats GODOT4 as a contract rather than the
          # first entry in a fallback list: if what it names does not run, it
          # fails instead of printing NOT CHECKED and exiting 0. Without that,
          # a broken install here would finish this job green having asserted
          # nothing - a job that cannot fail.
          echo "GODOT4=$bin" >> "$GITHUB_ENV"

      - run: npm ci

      # The run log carries the count: "11 of 11 Godot test scripts passed, 131
      # checks". The floor is asserted inside the tool (MIN_CHECKS, 60 against a
      # real 131), so every script can be found, parse and exit clean while
      # checking nothing and this still goes red.
      - name: Godot tests
        run: npm run test:godot

  # The Rust half. Separate so it does not hold up the fast feedback.
  tauri:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json bundles src-tauri/vendor/Ruby4Lich5.exe, and that
      # directory is gitignored (65 MB, rebuilt on Lich's own schedule).
      # build.rs validates resource paths, so with it absent EVERY Rust step
      # fails before compiling anything - clippy and cargo test included, not
      # only the packaging one. Fetch it up front. The script verifies the
      # download against GitHub's published sha256 and no-ops when current.
      # The token is what stops this step flaking. Unauthenticated GitHub API
      # calls are limited to 60 an hour per source address, and Actions runners
      # share addresses across customers, so a run can land on a bucket
      # somebody else has already emptied: this step failed with HTTP 403 three
      # times on 5 Sep 2026 on three unrelated pull requests, each one fixed by
      # an unchanged rerun. GITHUB_TOKEN raises the limit to 1,000 an hour for
      # this repository and needs no permission beyond the default read.
      - name: Vendor Ruby4Lich5
        run: npm run vendor:fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # MSI (WiX) used to be a second bundle target here and was the one
      # thing in this whole job that was ever flaky - WiX's light.exe,
      # freshly downloaded and extracted on every single `tauri build` call,
      # intermittently failed to launch at all (`failed to run
      # ...\WixTools314\light.exe`, no stderr). Nothing in this app's design
      # or docs ever called for MSI specifically - NSIS alone already gives
      # the no-admin, current-user install this app targets - and MSI is the
      # format you'd reach for if this were deployed via enterprise Group
      # Policy/SCCM, which it isn't. Dropped from tauri.conf.json's bundle
      # targets (2026-08-29) rather than keep working around a tool nothing
      # here actually needs.
      - name: Build installer
        run: npm run tauri:build

      # Until 5 Sep 2026 the job stopped at the line above: it built a 217 MB
      # NSIS installer on every push and then threw it away with the runner.
      # F8 ("uninstall test on the CI artefact") and F9 both name an artefact
      # that had never existed - `gh api .../actions/runs/<id>/artifacts` was
      # empty on runs whose `tauri` job says success, which is the same shape
      # as every other check in this repo that reported a pass for work it had
      # not done. Uploading it is what makes "install what CI built, on a
      # clean machine" a thing anybody can do without a Windows box.
      #
      # The hash is printed rather than only the name because that is what
      # lets a tester prove the file they installed is the file CI produced:
      # the run log carries the digest, and `certutil -hashfile` in the guest
      # has to agree with it. An artefact whose provenance is "it downloaded
      # from somewhere" proves nothing about this commit.
      - name: Record what was built
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) {
            throw "Expected exactly one NSIS setup .exe, found $($files.Count). The build step cannot have produced what the upload below claims."
          }
          $f = $files[0]
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "installer : $($f.Name)"
          Write-Host "bytes     : $($f.Length)"
          Write-Host "sha256    : $sha"
          # Onto the run summary too, so the digest is on the page somebody
          # actually opens rather than only in a collapsed log. Plain lines,
          # no markdown escaping: a table here would need backticks, and a
          # backtick is PowerShell's escape character inside a YAML block
          # scalar, which is three quoting rules stacked for no gain.
          $lines = @(
            '### Installer',
            '',
            "    file   : $($f.Name)",
            "    bytes  : $($f.Length)",
            "    sha256 : $sha",
            '',
            'Downloadable for 7 days as the `dr-companion-nsis-installer` artefact.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Seven days, because this is a per-commit build artefact and not a
      # release: long enough to install and uninstall it on the VM, short
      # enough that main's push rate does not accumulate hundreds of them.
      # `if-no-files-found: error` matters more than it looks - the default is
      # a warning, so a glob that stopped matching would publish an empty
      # artefact and the job would still be green.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: dr-companion-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The one Ruby this app actually depends on is the one it bundles -
  # Ruby4Lich5, currently 4.0.x (DEPENDENCIES.md, docs/DESIGN.md's own
  # dependency table: "Ruby 4.0+"). Anything older is tried in good faith,
  # for whoever is still running an unbundled Lich install on an older Ruby,
  # but it was never the officially supported version and a flake on 3.2-3.4
  # must not gate a merge the way a real 4.0 failure would. Not a stand-in
  # for actually fixing what's flaky on 3.4 (server_test.rb's message-order
  # assumptions, under investigation) - just the right blast radius while
  # that's ongoing: a version this app doesn't claim to run on should never
  # be what blocks a PR.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4, '4.0']
    continue-on-error: ${{ matrix.ruby != '4.0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # ws, for the round-trip test below.
      - run: npm ci

      - name: Commands
        run: ruby lich-scripts/test/cmd_test.rb lich-scripts/companion_bridge.lic
      - name: Runaway guard
        run: ruby lich-scripts/test/runaway_test.rb lich-scripts/companion_bridge.lic
      - name: YAML
        run: ruby lich-scripts/test/yaml_test.rb lich-scripts/companion_bridge.lic
      - name: Server
        run: ruby lich-scripts/test/server_test.rb lich-scripts/companion_bridge.lic
      - name: Map
        run: ruby lich-scripts/test/map_test.rb lich-scripts/companion_bridge.lic
      - name: Live round-trip
        run: npm run test:live
