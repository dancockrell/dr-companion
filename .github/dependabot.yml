# Grouped and monthly: one PR per ecosystem, not one per package.
#
# There is no `github-actions` ecosystem here any more. This repository has no
# workflows and Actions is disabled for it, so an action bump would be a pull
# request nobody could act on. The entry went with its subject rather than sit
# here producing noise. npm and cargo are unaffected: they describe what this
# app ships, not what verifies it.
#
#   gh api repos/dancockrell/dr-companion/actions/permissions   # enabled: false
#   git ls-tree HEAD .github/workflows                          # empty
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ['*'] }
    ignore:
      # 7.x is the Go rewrite: its root export is a version string, not the
      # classic compiler API. 27 tools/*-test.mjs files call
      # ts.transpileModule/ts.ModuleKind/ts.ScriptTarget as a lightweight
      # in-memory TSX->JS shim for tests, and 7.x has no compatible
      # replacement (functionality moved behind an incompatible unstable/ast
      # subpath). A routine grouped bump silently broke ~20 test suites at
      # once (PR #160) with the CI summary undercounting it, since a test
      # that throws before asserting anything lands in "not run", not
      # "failed". Revisit only as a deliberate migration that rewrites the
      # test harness's transpilation strategy, never as a version bump.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ['*'] }
