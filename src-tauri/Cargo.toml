[package]
name = "dr-companion"
version = "0.1.1"
description = "DR Companion — a DragonRealms control panel for Lich"
authors = ["Dan Cockrell"]
edition = "2021"
license = "MIT"

[lib]
name = "dr_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Setup: fetching release metadata and verified downloads.
# rustls rather than native-tls so a build machine needs no OpenSSL, and
# default-features off to keep the dependency surface small.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "charset",
  "http2",
] }
sha2 = "0.10"
# git blob hashing, to verify files that ship in a repo rather than a release
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# `macros` only, for tokio::join!. Tauri already supplies the runtime.
tokio = { version = "1", default-features = false, features = ["macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
