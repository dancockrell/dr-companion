[package]
name = "dr-companion"
version = "0.1.1"
description = "DR Companion — a DragonRealms control panel for Lich"
authors = ["Dan Cockrell"]
edition = "2021"
license = "MIT"

[lib]
name = "dr_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "protocol-asset": the optional music library is installed into the app
# data directory, and a track there is played through the asset protocol.
# Nothing else is granted; the scope is a single directory, allowed at
# startup from `music::music_dir()` (see lib.rs).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Setup: fetching release metadata and verified downloads.
# rustls rather than native-tls so a build machine needs no OpenSSL, and
# default-features off to keep the dependency surface small.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "charset",
  "http2",
] }
sha2 = "0.11"
base64 = "0.23"
# git blob hashing, to verify files that ship in a repo rather than a release
sha1 = "0.11"
# One thing: OS randomness for the script API's connection token
# (script_api.rs). Tiny, audited, no_std-friendly - not pulling in a full
# `rand` for one call to getrandom().
getrandom = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
# "rt" for spawn_blocking, which keeps the multi-second lich_status off the
# UI thread - see lich.rs. "macros" for tokio::join!. Tauri supplies the
# runtime itself; these are the pieces this crate names directly.
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
# The EAccess account login (eaccess.rs) is a raw TLS socket to
# eaccess.play.net:7910, not HTTP, so reqwest cannot carry it.
#
# This was `rustls` + `webpki-roots`, and it could never have worked. Measured
# 9 Sep 2026 against the live server (`docs/LICH_NATIVE_LOGIN.md` §3.1 carries
# the measurement): eaccess.play.net:7910 accepts exactly one cipher suite,
# `TLS_RSA_WITH_AES_128_GCM_SHA256` - TLS 1.2, static RSA key exchange, no
# forward secrecy - and closes the connection on TLS 1.3 and on every ECDHE
# suite offered. rustls has never implemented static RSA key exchange and will
# not, so the two have no suite in common and the server hangs up during the
# handshake. That is the `unexpected end of file` the first real sign-in showed.
#
# `native-tls` is the platform's own TLS. On Windows - the only platform this
# app ships for - it is schannel, which speaks that suite and needs no OpenSSL;
# the `schannel` crate it uses on this target pulls windows-sys and nothing
# more. On a Unix build host native-tls would want OpenSSL, which is the reason
# the removed line gave for choosing rustls. The trade is accepted: there is no
# Unix build of this app, and a TLS stack that cannot reach the login server is
# not a smaller dependency, it is a broken one.
#
# Measured rather than asserted: `node tools/build-third-party.mjs` resolves the
# lock for x86_64-pc-windows-msvc and this change adds exactly two crates to the
# shipped binary, 326 to 328 - `native-tls` (MIT OR Apache-2.0) and `schannel`
# (MIT). `openssl-sys` and friends enter Cargo.lock and are target-gated out of
# every Windows build, which is why they are not in THIRD_PARTY.md.
#
# Certificate trust is neither the platform default nor disabled. That server's
# certificate is self-signed with no CN and no subjectAltName, so
# `eaccess::connect` makes the pinned certificate in
# `certs/eaccess-play-net.pem` the only trust anchor and then compares the
# presented DER to it byte for byte. `eaccess.rs`'s "Certificate validation"
# section is the argument; `danger_accept_invalid_certs` appears nowhere.
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
# One call: GetDiskFreeSpaceExW, so a multi-gigabyte music install refuses
# before it starts rather than failing on a `write_all` some minutes in
# (#402 item 2). There is no std API for free space, and `fs2`/`sysinfo`
# would each be a new crate for one number. `windows-sys` is already in this
# tree as a transitive dependency of tauri at this exact version, so naming
# it directly adds no crate to the lock and no new licence - it is
# MIT OR Apache-2.0, the same as the rest.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
# N8: the optional "remember my password" store, which is Windows Credential
# Manager and nothing else (`docs/LICH_NATIVE_LOGIN.md` §5.2 - there is no
# third option). MIT OR Apache-2.0, the same as everything else here.
#
# `default-features = false` on purpose. keyring's defaults switch on the
# secret-service backend as well, which drags zbus and a D-Bus stack into a
# Windows-only application for a store it will never open. The one feature
# named below is the Windows Credential Manager backend, which is the whole
# reason the crate is here.
#
# Target-gated for the same reason `windows-sys` above is: this app ships for
# Windows, `credential_store.rs` has a `#[cfg(not(windows))]` half that says
# plainly it cannot store anything, and a platform nothing installs on should
# not pull a credential crate to be told so.
# `v1` is the all-in-one `Entry` API and is not optional: without it (or `cli`)
# the crate is a `compile_error!`. It is also what supplies
# `Entry::store_status()`, which is how `credential_store.rs` can say *why* the
# store is unavailable rather than reporting an empty one.
keyring = { version = "4", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dev-dependencies]
# "time" for the sleeps the music install tests pace themselves with. It
# arrives transitively through Tauri's own tokio today, which is not a thing
# to rely on: a test that stops compiling because some dependency dropped a
# feature is a bad afternoon.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
